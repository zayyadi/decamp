name: Agent

# Detection agent (SPEC §3.1, M4). Secrets and variables are listed in
# README.md under "Running the agent on GitHub Actions".
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to run
        type: choice
        options: [all, ingest, classify]
        default: all
      dry_run:
        description: Dry run (read the database, write nothing)
        type: boolean
        default: true

# One run at a time. Crawl delays can make a run outlast the 15-minute slot;
# the next one then waits instead of racing it over the same articles.
concurrency:
  group: agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # robots.txt answers are kept for 24 h (AGENT.md §2). Each run saves a
      # new cache entry and restores the latest one.
      # Only for AGENT_LLM_BACKEND=claude-cli: classification runs `claude -p`
      # on the Claude subscription behind CLAUDE_CODE_OAUTH_TOKEN.
      - name: Install Claude Code
        if: vars.AGENT_LLM_BACKEND == 'claude-cli'
        run: npm install -g @anthropic-ai/claude-code@2.1.311

      - uses: actions/cache@v5
        with:
          path: .agent-cache
          key: agent-cache-${{ github.run_id }}
          restore-keys: agent-cache-

      - name: Run agent
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AGENT_LLM_BACKEND: ${{ vars.AGENT_LLM_BACKEND }}
          AGENT_CONTACT_URL: ${{ vars.AGENT_CONTACT_URL }}
          # Optional; lib/env.ts supplies the defaults when these are unset.
          CLASSIFIER_MODEL: ${{ vars.CLASSIFIER_MODEL }}
          ESCALATION_MODEL: ${{ vars.ESCALATION_MODEL }}
          CONFIDENCE_PUBLISH: ${{ vars.CONFIDENCE_PUBLISH }}
          CONFIDENCE_REVIEW: ${{ vars.CONFIDENCE_REVIEW }}
          AGENT_LOOKBACK_HOURS: ${{ vars.AGENT_LOOKBACK_HOURS }}
          AGENT_MAX_LLM_CALLS_PER_RUN: ${{ vars.AGENT_MAX_LLM_CALLS_PER_RUN }}
          # Keep schedules read-only until the launch rehearsal is approved.
          # Manual runs still follow the explicit dry_run input.
          STAGE: ${{ inputs.stage || 'all' }}
          DRY_RUN: ${{ ((github.event_name == 'schedule' && vars.AGENT_LIVE_ENABLED != 'true') || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) && 'true' || 'false' }}
        # Falls back to ingest-only on schedules without model credentials; see the script.
        run: bash scripts/ci/run-agent.sh

      - name: Retain rehearsal logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: agent-run-${{ github.run_id }}
          path: agent-run.log
          retention-days: 7
          if-no-files-found: ignore
